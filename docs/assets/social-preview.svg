<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Humanly — regression testing for AI agents</title>
  <desc id="description">Humanly connects an agent, evaluates its response, compares a baseline, and detects deployment-blocking regressions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120925"/>
      <stop offset=".55" stop-color="#241044"/>
      <stop offset="1" stop-color="#35156a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#07030d" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1160" cy="40" r="250" fill="#7c3aed" opacity=".18"/>
  <circle cx="35" cy="620" r="220" fill="#f59e0b" opacity=".09"/>
  <path d="M0 118C236 34 378 185 610 102S1002 29 1280 116" fill="none" stroke="#a78bfa" stroke-width="2" opacity=".14"/>

  <g transform="translate(68 64)">
    <rect width="48" height="48" rx="14" fill="#7c3aed"/>
    <path d="M14 15v18m20-18v18M14 24h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="65" y="37" fill="#fff" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="800">Humanly</text>
    <rect x="226" y="8" width="65" height="32" rx="16" fill="#ffffff" opacity=".12"/>
    <text x="241" y="30" fill="#ddd6fe" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="800">OSS</text>
  </g>

  <text x="68" y="190" fill="#fff" font-family="Inter, ui-sans-serif, system-ui" font-size="56" font-weight="800">Regression testing</text>
  <text x="68" y="253" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui" font-size="56" font-weight="800">for AI agents.</text>
  <text x="68" y="305" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="22">Connect. Evaluate. Compare. Block regressions.</text>

  <g transform="translate(68 370)">
    <rect width="178" height="72" rx="16" fill="#ffffff" opacity=".08" stroke="#a78bfa" stroke-opacity=".35"/>
    <circle cx="32" cy="36" r="12" fill="#a78bfa"/>
    <text x="56" y="43" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700">Connect agent</text>
    <path d="M190 36h34" stroke="#a78bfa" stroke-width="2"/>
    <path d="M216 29l9 7-9 7" fill="none" stroke="#a78bfa" stroke-width="2"/>

    <rect x="236" width="178" height="72" rx="16" fill="#ffffff" opacity=".08" stroke="#a78bfa" stroke-opacity=".35"/>
    <circle cx="268" cy="36" r="12" fill="#8b5cf6"/>
    <text x="292" y="43" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700">Evaluate</text>
    <path d="M426 36h34" stroke="#a78bfa" stroke-width="2"/>
    <path d="M452 29l9 7-9 7" fill="none" stroke="#a78bfa" stroke-width="2"/>

    <rect x="472" width="178" height="72" rx="16" fill="#ffffff" opacity=".08" stroke="#a78bfa" stroke-opacity=".35"/>
    <circle cx="504" cy="36" r="12" fill="#f59e0b"/>
    <text x="528" y="43" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700">Gate release</text>
  </g>

  <g transform="translate(820 142)" filter="url(#shadow)">
    <rect width="390" height="350" rx="24" fill="#fff"/>
    <text x="28" y="45" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800" letter-spacing="1.5">REGRESSION REPORT</text>
    <rect x="270" y="22" width="92" height="35" rx="18" fill="#fee2e2"/>
    <text x="291" y="45" fill="#991b1b" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800">BREACH</text>
    <line x1="28" y1="78" x2="362" y2="78" stroke="#e2e8f0"/>

    <text x="28" y="119" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Baseline</text>
    <text x="28" y="169" fill="#166534" font-family="Inter, ui-sans-serif, system-ui" font-size="42" font-weight="800">1.00</text>
    <text x="195" y="119" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Current</text>
    <text x="195" y="169" fill="#dc2626" font-family="Inter, ui-sans-serif, system-ui" font-size="42" font-weight="800">0.00</text>

    <rect x="28" y="205" width="334" height="112" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="55" cy="238" r="12" fill="#fee2e2"/>
    <path d="M50 233l10 10m0-10l-10 10" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <text x="78" y="244" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">non_empty_response</text>
    <text x="55" y="283" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Failed · baseline delta −1.00</text>
  </g>

  <text x="68" y="565" fill="#ddd6fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">docker compose up --build</text>
  <text x="68" y="598" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="17">Self-hosted · AGPL-3.0-or-later · github.com/somnath-biswas-github/humanly</text>
</svg>