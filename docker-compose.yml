services:
  app:
    build: .
    ports:
      - "${HUMANLY_PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgresql://humanly:${POSTGRES_PASSWORD:-humanly}@postgres:5432/humanly
      NODE_ENV: production
      PORT: 5000
      HUMANLY_API_KEY: ${HUMANLY_API_KEY:?set HUMANLY_API_KEY in .env}
      HUMANLY_ALLOW_PRIVATE_CONNECTORS: ${HUMANLY_ALLOW_PRIVATE_CONNECTORS:-false}
      RAG_JUDGE_API_KEY: ${RAG_JUDGE_API_KEY:-}
      RAG_JUDGE_BASE_URL: ${RAG_JUDGE_BASE_URL:-https://api.openai.com/v1}
      RAG_JUDGE_MODEL: ${RAG_JUDGE_MODEL:-gpt-4o-mini}
      RAG_JUDGE_ALLOW_PRIVATE: ${RAG_JUDGE_ALLOW_PRIVATE:-false}
    volumes:
      - uploads:/opt/humanly/uploads
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health | grep -q '\"ready\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: humanly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humanly}
      POSTGRES_DB: humanly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanly -d humanly"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
