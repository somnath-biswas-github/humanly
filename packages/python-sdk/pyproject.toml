[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humanly"
version = "0.1.0"
description = "Python SDK for the Humanly AI Agent Testing Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Humanly", email = "hello@humanly.ai" }]
keywords = ["ai", "agents", "testing", "llm", "evaluation", "synthetic-users"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://humanly.ai"
Documentation = "https://humanly.ai/docs"
Repository = "https://github.com/somnath-biswas-github/humanly"
"Bug Tracker" = "https://github.com/somnath-biswas-github/humanly/issues"

[tool.hatch.build.targets.wheel]
packages = ["humanly"]
